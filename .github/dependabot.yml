version: 2
updates:
  - package-ecosystem: npm
    directory: /my-culture-app
    schedule:
      interval: weekly
    # Waits until a release is two weeks old, like the rule for manual updates.
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

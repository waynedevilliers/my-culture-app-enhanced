name: CI

# Checks the Next.js app in my-culture-app/. The old projects in legacy/
# are kept as reference and are not checked.
# Runs once per change: on pull requests, and on pushes to main.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: my-culture-app

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # prisma.config.ts needs a value; no database is contacted.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/unused
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: my-culture-app/.nvmrc
          cache: npm
          cache-dependency-path: my-culture-app/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run type-check
      - run: npm run format:check
      # Unused files, exports and dependencies.
      - run: npm run knip

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: my-culture-app/.nvmrc
          cache: npm
          cache-dependency-path: my-culture-app/package-lock.json
      - run: npm ci
      # Unit tests mock Prisma: no database needed.
      - run: npm run test:coverage -- --run

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: my-culture-app/.nvmrc
          cache: npm
          cache-dependency-path: my-culture-app/package-lock.json
      - run: npm ci
      # High and critical advisories fail the build, for all packages.
      - run: npm run audit
      # Packages that ship with the site: same level. Moderate advisories in
      # the BlockNote editor stack are listed in the README.
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: myculture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/myculture
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: my-culture-app/.nvmrc
          cache: npm
          cache-dependency-path: my-culture-app/package-lock.json
      - run: npm ci
      # Fresh secrets for every run; never stored or printed.
      - name: Generate test secrets
        run: |
          JWT=$(openssl rand -hex 32)
          ADMIN=$(openssl rand -hex 16)
          echo "::add-mask::$JWT"
          echo "::add-mask::$ADMIN"
          echo "JWT_SECRET=$JWT" >> "$GITHUB_ENV"
          echo "SEED_ADMIN_PASSWORD=$ADMIN" >> "$GITHUB_ENV"
      - run: npx prisma db push --skip-generate
      - run: npm run prisma:seed
      - run: npx playwright install --with-deps chromium
      # Desktop and mobile Chrome. Builds and starts the app first.
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: my-culture-app/playwright-report/
          retention-days: 7
